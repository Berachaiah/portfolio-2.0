{% extends "admin_dash/base.html" %}
{% block title %}Edit Research{% endblock %}{% block page_title %}Edit Research Item{% endblock %}{% block breadcrumb %}Research › Edit{% endblock %}
{% block content %}
<div style="max-width:600px">
  <div class="card">
    <div style="font-weight:700;font-size:.9rem;margin-bottom:1.5rem">Edit Research Item</div>
    <form method="post">{% csrf_token %}
      <div class="form-group"><label class="form-label">Number</label><input class="form-input" type="number" name="number" value="{{ item.number }}" min="1"/></div>
      <div class="form-group"><label class="form-label">Title *</label><input class="form-input" type="text" name="title" value="{{ item.title }}" required/></div>
      <div class="form-group"><label class="form-label">Description *</label><textarea class="form-input" name="description" rows="5" required>{{ item.description }}</textarea></div>
      <div style="display:flex;gap:.75rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'admin_research' %}" class="btn btn-ghost">Cancel</a>
        <a href="{% url 'admin_research_delete' item.pk %}" class="btn btn-danger" onclick="return confirm('Delete this item?')" style="margin-left:auto">Delete</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
