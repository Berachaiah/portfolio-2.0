{% extends "admin_dash/base.html" %}
{% block title %}Edit Certificate{% endblock %}{% block page_title %}Edit Certificate{% endblock %}{% block breadcrumb %}Certificates › Edit{% endblock %}
{% block content %}
<div style="max-width:560px">
  <div class="card">
    <div style="font-weight:700;font-size:.9rem;margin-bottom:1.5rem">Edit Certificate</div>
    <form method="post">{% csrf_token %}
      <div class="form-group"><label class="form-label">Certificate Name *</label><input class="form-input" type="text" name="name" value="{{ cert.name }}" required/></div>
      <div class="form-group"><label class="form-label">Issuer *</label><input class="form-input" type="text" name="issuer" value="{{ cert.issuer }}"/></div>
      <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="text" name="date" value="{{ cert.date }}" placeholder="Oct 2025"/></div>
      <div class="form-group"><label class="form-label">Display Order</label><input class="form-input" type="number" name="order" value="{{ cert.order }}" min="0"/></div>
      <div style="display:flex;gap:.75rem;margin-top:1.5rem">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'admin_certificates' %}" class="btn btn-ghost">Cancel</a>
        <a href="{% url 'admin_cert_delete' cert.pk %}" class="btn btn-danger" onclick="return confirm('Delete this certificate?')" style="margin-left:auto">Delete</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
